# Buduje EMKA na trzech systemach (PyInstaller nie buduje krzyżowo). Działa na GitHub Actions i Gitea Actions.
# Uruchamia się po wypchnięciu tagu v* (np. v1.3.0) albo ręcznie (Actions → build → Run workflow).
# Gotowe pliki są w artefaktach przebiegu. Używa tools/build.py - nie wymaga make ani powłoki sh.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux}  # starszy system = binarka działa też na starszych dystrybucjach
          - {os: windows-latest, target: win}
          - {os: macos-latest, target: mac}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zależności systemowe (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Testy
        run: python -m unittest discover -s tests
      - name: Budowanie i self-test (Linux, wirtualny ekran)
        if: matrix.target == 'linux'
        run: xvfb-run -a python tools/build.py
      - name: Budowanie i self-test
        if: matrix.target != 'linux'
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: EMKA-${{ matrix.target }}
          path: dist/EMKA-*
