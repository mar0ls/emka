# Buduje EMKA na trzech systemach (PyInstaller nie buduje krzyżowo). Działa na GitHub Actions i Gitea Actions.
# Uruchamia się po wypchnięciu tagu v* (np. v1.3.0) albo ręcznie. Gotowe pliki są w artefaktach przebiegu.
# Uwaga: wymaga runnerów dla Windows i macOS; ten plik nie był jeszcze uruchamiany.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux}  # starszy system = binarka działa też na starszych dystrybucjach
          - {os: windows-latest, target: win}
          - {os: macos-latest, target: mac}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zależności systemowe (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Make (Windows)
        if: matrix.target == 'win'
        run: choco install make -y
      - name: Testy
        run: make test PYTHON=python
      - name: Budowanie
        run: |
          if [ "${{ matrix.target }}" = linux ]; then
            xvfb-run -a make linux PYTHON=python
          else
            make ${{ matrix.target }} PYTHON=python
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: EMKA-${{ matrix.target }}
          path: |
            dist/EMKA-*
