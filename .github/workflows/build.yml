# Buduje EMKA na trzech systemach (PyInstaller nie buduje krzyżowo) i po wypchnięciu tagu publikuje wydanie.
#
# Wydanie: zmień wersję w emka/__init__.py, dopisz wpis w CHANGELOG.md, zatwierdź, a potem:
#   git tag v0.1.0 && git push origin v0.1.0
# Ręczne uruchomienie (Actions -> build -> Run workflow) tylko buduje i zapisuje artefakty, niczego nie publikuje.
#
# Akcje są przypięte do pełnych skrótów commitów (nie do ruchomych tagów), a zadania dostają minimalne uprawnienia.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag zgadza się z wersją i CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/release.py check-tag "$GITHUB_REF_NAME"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux}  # starszy system = program działa też na starszych dystrybucjach
          - {os: windows-latest, target: win}
          - {os: macos-latest, target: mac}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Zależności systemowe (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Testy
        run: python -m unittest discover -s tests
      - name: Budowanie i self-test (Linux, wirtualny ekran)
        if: matrix.target == 'linux'
        run: xvfb-run -a python tools/build.py
      - name: Budowanie i self-test
        if: matrix.target != 'linux'
        run: python tools/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: EMKA-${{ matrix.target }}
          path: dist/EMKA-*
          if-no-files-found: error

  release:
    # Tylko po wypchnięciu tagu. Jedyne zadanie z prawem zapisu.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: EMKA-*
          path: release
          merge-multiple: true
      - name: Sumy kontrolne i opis wydania
        run: |
          python3 tools/release.py checksums release
          cp LICENSE THIRD_PARTY_NOTICES.md release/
          python3 tools/release.py notes > notes.md
      - name: Publikacja
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "EMKA ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
